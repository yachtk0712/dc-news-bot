name: Daily Data Center News

on:
  schedule:
    # UTC 기준 22:10 = 한국시간(KST) 오전 7:10
    # (GitHub는 매 정시(0분)에 스케줄이 몰려 지연/누락되기 쉬워서 10분 뒤로 설정)
    - cron: "10 22 * * *"
  workflow_dispatch: {}   # Actions 탭에서 수동 실행 버튼도 생김

jobs:
  send-news:
    runs-on: ubuntu-latest
    timeout-minutes: 5   # 5분 넘게 걸리면 자동으로 중단 (무한 대기 방지)
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 뉴스 수집 및 이메일 발송
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python fetch_datacenter_news.py
